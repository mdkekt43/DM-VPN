<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM VPN</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#070b14;--panel:rgba(15,22,38,.78);--panel2:rgba(20,30,50,.72);
  --line:rgba(255,255,255,.09);--text:#f4f7ff;--muted:#8e9bb3;
  --blue:#5b8cff;--cyan:#35e0c2;--shadow:rgba(0,0,0,.42);
}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--text);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 10%,rgba(91,140,255,.18),transparent 30%),
    radial-gradient(circle at 90% 85%,rgba(53,224,194,.13),transparent 28%),
    linear-gradient(145deg,#060914,#0a1020 55%,#070c17);
}
body:before,body:after{content:"";position:fixed;border-radius:50%;pointer-events:none;filter:blur(1px)}
body:before{width:280px;height:280px;top:-130px;right:-90px;background:rgba(91,140,255,.12)}
body:after{width:320px;height:320px;bottom:-180px;left:-120px;background:rgba(53,224,194,.08)}
.card{
  width:min(100%,560px);position:relative;overflow:hidden;padding:28px;
  background:linear-gradient(145deg,rgba(17,26,45,.88),rgba(9,15,28,.82));
  border:1px solid var(--line);border-radius:28px;
  box-shadow:0 30px 90px var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(24px);
}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.035),transparent 35%,rgba(91,140,255,.025))}
.topline{height:4px;width:82px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 24px rgba(91,140,255,.45)}
.logo{
  width:76px;height:76px;margin:auto;border-radius:23px;display:grid;place-items:center;
  color:#fff;font-size:27px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(145deg,#477dff,#35d7c0);
  box-shadow:0 16px 35px rgba(65,126,255,.28),inset 0 1px 1px rgba(255,255,255,.35);
}
h1{text-align:center;margin:17px 0 6px;font-size:29px;letter-spacing:-.5px}
.subtitle{text-align:center;color:var(--muted);font-size:12px;margin-bottom:19px}
.badge{
  width:max-content;margin:0 auto 20px;padding:8px 14px;border-radius:30px;
  background:rgba(53,224,194,.08);color:#65e6cf;border:1px solid rgba(53,224,194,.16);
  font-size:11px;font-weight:bold;box-shadow:0 8px 25px rgba(53,224,194,.05)
}
.info{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:20px}
.info-box{
  padding:15px;border-radius:17px;text-align:center;
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)
}
.icon{font-size:19px;margin-bottom:4px;color:#7da2ff}
.info-box span{display:block;color:#8491a8;font-size:10px;margin-bottom:5px}.info-box strong{font-size:15px}
label{display:block;margin-bottom:8px;font-size:12px;font-weight:bold;color:#dbe4f5}
.link-wrap{
  display:flex;direction:ltr;gap:7px;background:rgba(3,8,17,.55);border:1px solid var(--line);
  border-radius:15px;padding:6px;box-shadow:inset 0 1px 8px rgba(0,0,0,.18)
}
input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:11px 9px;color:#aebbd0;font-size:10px;direction:ltr}
button{
  border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,#4c7dff,#36cbb4);
  border-radius:11px;padding:0 16px;font-weight:bold;min-height:43px;
  box-shadow:0 8px 22px rgba(68,124,255,.2);transition:.2s
}
button:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(68,124,255,.3)}
button:active{transform:scale(.98)}
.success{display:none;text-align:center;color:#5de1ca;font-size:11px;font-weight:bold;margin-top:10px}
.download-card{
  margin-top:17px;padding:18px;border-radius:19px;
  background:linear-gradient(145deg,rgba(91,140,255,.08),rgba(53,224,194,.055));
  border:1px solid var(--line);text-align:center
}
.app-icon{
  width:56px;height:56px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;
  font-size:25px;background:linear-gradient(145deg,#477dff,#35d7c0);
  box-shadow:0 10px 25px rgba(65,126,255,.2)
}
.app-icon img{width:46px;height:46px;object-fit:contain;border-radius:11px;display:block}
.download-card h3{margin:0 0 5px;font-size:15px}.download-card p{margin:0 0 13px;color:#8592a9;font-size:10px}
.download-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;
  text-decoration:none;color:#fff;background:linear-gradient(135deg,#4c7dff,#36cbb4);
  border-radius:12px;font-size:12px;font-weight:bold;box-shadow:0 9px 23px rgba(68,124,255,.18);transition:.2s
}
.download-btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.note{
  margin-top:15px;padding:14px 16px;text-align:center;line-height:1.85;font-size:11px;
  color:#93a1b7;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:15px
}
.note b{color:#6e98ff}.footer{text-align:center;color:#5f6c82;font-size:9px;margin-top:18px}
@media(max-width:480px){
  body{padding:12px}.card{padding:23px 15px;border-radius:23px}.logo{width:70px;height:70px}
  h1{font-size:26px}.info{gap:8px}.info-box{padding:13px 7px}
  .link-wrap{flex-direction:column}.link-wrap input{width:100%;font-size:9px;text-align:center}
  button{width:100%}.download-card{padding:16px}
}
</style>

<style>
/* Cursor-following neon halo */
.card::before{
  content:"";
  position:absolute;
  width:170px;height:170px;
  left:var(--mx,50%);top:var(--my,20%);
  transform:translate(-50%,-50%);
  border-radius:50%;
  pointer-events:none;
  background:conic-gradient(from 0deg,#6d5cff,#00e5ff,#39ffb0,#ff4fd8,#6d5cff);
  filter:blur(28px);
  opacity:.13;
  transition:opacity .25s ease;
  z-index:0;
}
.card > *{position:relative;z-index:1}

.card .link-wrap,
.card .download-card,
.card .info-box,
.card .badge{
  position:relative;
  overflow:hidden;
}
.card .link-wrap::after,
.card .download-card::after,
.card .info-box::after,
.card .badge::after{
  content:"";
  position:absolute;
  width:115px;height:115px;
  left:var(--lx,50%);top:var(--ly,50%);
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(0,229,255,.34) 0%,
    rgba(125,92,255,.18) 32%,
    rgba(255,79,216,.08) 55%,
    transparent 72%);
  filter:blur(7px);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.card .link-wrap:hover::after,
.card .download-card:hover::after,
.card .info-box:hover::after,
.card .badge:hover::after{opacity:1}

/* More attention-grabbing instruction */
.note{
  position:relative;
  border:1px solid rgba(0,229,255,.42)!important;
  background:
    linear-gradient(135deg,rgba(0,229,255,.12),rgba(125,92,255,.14),rgba(57,255,176,.10))!important;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 10px 35px rgba(0,229,255,.12),
    0 0 28px rgba(125,92,255,.10);
  animation:notePulse 2.8s ease-in-out infinite;
}
.note::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(90deg,#00e5ff,#7d5cff,#ff4fd8,#39ffb0,#00e5ff);
  background-size:300% 100%;
  animation:borderFlow 5s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.note b{
  color:#00e5ff!important;
  font-size:14px;
  text-shadow:0 0 12px rgba(0,229,255,.55);
}
.note strong{
  color:#fff;
  font-size:14px;
}

@keyframes borderFlow{
  0%{background-position:0% 50%}
  100%{background-position:300% 50%}
}
@keyframes notePulse{
  0%,100%{transform:translateY(0);box-shadow:0 10px 35px rgba(0,229,255,.12),0 0 28px rgba(125,92,255,.10)}
  50%{transform:translateY(-2px);box-shadow:0 14px 42px rgba(0,229,255,.18),0 0 34px rgba(125,92,255,.16)}
}
</style>

</head>

async function copySubscription(){
  const input=document.getElementById('subscription');
  const success=document.getElementById('success');
  try{await navigator.clipboard.writeText(input.value)}
  catch{input.select();document.execCommand('copy')}
  success.style.display='block';

<script>
(() => {
  const card = document.querySelector('.card');
  if (!card) return;

  const move = (e) => {
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', `${e.clientX - r.left}px`);
    card.style.setProperty('--my', `${e.clientY - r.top}px`);

    const target = e.target.closest('.link-wrap, .download-card, .info-box, .badge');
    if (target) {
      const tr = target.getBoundingClientRect();
      target.style.setProperty('--lx', `${e.clientX - tr.left}px`);
      target.style.setProperty('--ly', `${e.clientY - tr.top}px`);
    }
  };

  card.addEventListener('mousemove', move);
  card.addEventListener('mouseenter', () => card.style.setProperty('--halo-opacity', '1'));
  card.addEventListener('mouseleave', () => card.style.setProperty('--halo-opacity', '0'));
})();
</script>
